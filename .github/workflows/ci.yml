name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test with isolated H2 database
        run: bash mvnw --batch-mode --no-transfer-progress verify
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tecnomanager_test
          POSTGRES_USER: tecnomanager_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U tecnomanager_test -d tecnomanager_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:55435/tecnomanager_test
      TEST_JDBC_USERNAME: tecnomanager_test
      TEST_JDBC_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify migrations and API with PostgreSQL 16
        run: bash mvnw --batch-mode --no-transfer-progress verify
